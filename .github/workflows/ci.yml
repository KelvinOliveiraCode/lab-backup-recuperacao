name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Conferir encoding dos arquivos de texto
        run: python tools/verificar_encoding.py

      - name: Verificar que o pacote importa
        run: python -c "import backuplab; print('backuplab ok')"

      - name: Rodar testes com cobertura
        run: python -m pytest --cov=backuplab --cov-report=term-missing --cov-report=xml

      - name: Conferir cobertura minima
        run: python -m coverage report --fail-under=70

      - name: Prova de aceite
        run: python tools/verificar_aceite.py

      - name: O ciclo completo funciona na CLI
        run: |
          python -m backuplab executar --origem dados/arquivos-originais --destino saida/
          python -m backuplab restaurar --backup saida/arquivos --destino restaurado/ --verificar --origem dados/arquivos-originais
          if ($LASTEXITCODE -ne 0) {
            Write-Error "a restauracao divergiu da origem"
            exit 1
          }
          Write-Output "ok: backup e restauracao conferem"

      - name: O exemplo esta atualizado
        run: |
          python tools/gerar_exemplo.py
          git diff --exit-code -- exemplos/relatorio-backup.md